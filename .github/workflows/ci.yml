name: CI

on:
  pull_request:
  push:
    branches: [master]
    tags: ['*']

jobs:
  swift-package:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build all SwiftPM products
        run: swift build
      - name: Run macOS tests with coverage
        run: |
          set -o pipefail
          if ! swift test --enable-code-coverage 2>&1 | tee /tmp/AxcUIKit-macOS-test.log; then
            {
              echo '## macOS 测试失败日志'
              echo '```text'
              tail -n 120 /tmp/AxcUIKit-macOS-test.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            ruby -e 'text = File.readlines(ARGV[0]).last(120).join.gsub("%", "%25").gsub("\r", "%0D").gsub("\n", "%0A"); puts "::error title=macOS 测试失败::#{text}"' /tmp/AxcUIKit-macOS-test.log
            exit 1
          fi
      - name: Enforce macOS coverage
        run: |
          COVERAGE_JSON="$(swift test --show-codecov-path)"
          ruby Scripts/check_coverage.rb "$COVERAGE_JSON" 90

  ios-package:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run iOS tests with coverage
        run: |
          set -o pipefail
          if ! xcodebuild \
            -workspace . \
            -scheme AxcUIKit-Package \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -enableCodeCoverage YES \
            -resultBundlePath /tmp/AxcUIKit-iOS.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee /tmp/AxcUIKit-iOS-xcodebuild.log; then
            {
              echo '## iOS 测试失败日志'
              echo '```text'
              tail -n 120 /tmp/AxcUIKit-iOS-xcodebuild.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            ruby -e 'text = File.readlines(ARGV[0]).last(120).join.gsub("%", "%25").gsub("\r", "%0D").gsub("\n", "%0A"); puts "::error title=iOS 测试失败::#{text}"' /tmp/AxcUIKit-iOS-xcodebuild.log
            exit 1
          fi
          xcrun xccov view --report --json /tmp/AxcUIKit-iOS.xcresult > /tmp/AxcUIKit-iOS-coverage.json
      - name: Enforce iOS coverage
        run: ruby Scripts/check_coverage.rb /tmp/AxcUIKit-iOS-coverage.json 90
